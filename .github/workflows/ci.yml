name: CI — сборка, проверки и примеры

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1" # раз в неделю: полигон не должен «тихо» разъезжаться с примерами

permissions:
  contents: read

jobs:
  quality:
    name: Сборка и проверки страниц
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Сгенерированные страницы совпадают с генератором
        run: node tools/generate.mjs --verify
      - name: Сборка dist
        run: node tools/build.mjs
      - name: Проверки страниц, ссылок, заданий и чек-листа
        run: node tools/check.mjs
      - name: Артефакт сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  smoke:
    name: Смоук-тест requests + BeautifulSoup
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости ядра курса
        run: pip install -r examples/requirements.txt
      - name: Сборка полигона
        run: node tools/generate.mjs --verify && node tools/build.mjs
      - name: Селекторы из карточек заданий работают
        run: python tools/validate_tasks.py --zero
      - name: Локальный сервер учебного HTTP
        run: |
          node tools/serve.mjs --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/index.html > /dev/null && break; sleep 1; done
      - name: Примеры и структура согласованы
        env:
          PARSER_BASE_URL: http://127.0.0.1:8000
        run: python examples/smoke_test.py
      - name: Лог сервера при падении
        if: failure()
        run: cat server.log

  urllib:
    name: Пример на чистой стандартной библиотеке
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node tools/build.mjs
      - run: |
          node tools/serve.mjs --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/index.html > /dev/null && break; sleep 1; done
      - name: 02_urllib_stdlib.py
        env:
          PARSER_BASE_URL: http://127.0.0.1:8000
        run: python examples/02_urllib_stdlib.py
      - name: 01_requests_basics.py
        env:
          PARSER_BASE_URL: http://127.0.0.1:8000
        run: |
          pip install requests beautifulsoup4 lxml
          python examples/01_requests_basics.py

  scrapy:
    name: Учебный паук Scrapy
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "scrapy>=2.11"
      - run: node tools/build.mjs
      - run: |
          node tools/serve.mjs --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/index.html > /dev/null && break; sleep 1; done
      - name: "Каталог: 12 карточек без дублей"
        env:
          PARSER_BASE_URL: http://127.0.0.1:8000
        run: |
          python examples/06_scrapy_spider.py catalog -O items.jsonl
          test "$(wc -l < items.jsonl)" -eq 12
          python -c "import json;rows=[json.loads(l) for l in open('items.jsonl',encoding='utf-8')];assert len({r['sku'] for r in rows})==12, rows[:2];assert all(r['price'] for r in rows);print('ok', sorted(r['sku'] for r in rows))"
      - name: "Цитаты: две страницы по rel=next"
        env:
          PARSER_BASE_URL: http://127.0.0.1:8000
        run: |
          python examples/06_scrapy_spider.py quotes -O quotes.jsonl
          python -c "import json;rows=[json.loads(l) for l in open('quotes.jsonl',encoding='utf-8')];assert len(rows)==20, len(rows);assert all(r['author'] for r in rows);print('ok', len(rows))"

  playwright:
    name: Динамические страницы (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright beautifulsoup4 requests && playwright install --with-deps chromium
      - run: node tools/build.mjs
      - run: |
          node tools/serve.mjs --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/index.html > /dev/null && break; sleep 1; done
      - name: 05_playwright_dynamic.py
        env:
          PARSER_BASE_URL: http://127.0.0.1:8000
        run: python examples/05_playwright_dynamic.py

  selenium:
    name: Динамические страницы (Selenium)
    if: github.event_name == 'workflow_dispatch' # драйвер и Chrome в раннере настраиваются вручную — запускаем по кнопке
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "selenium>=4.21" requests beautifulsoup4
      - name: Chrome и chromedriver
        run: |
          sudo apt-get update && sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser chromium-driver
      - run: node tools/build.mjs
      - run: |
          node tools/serve.mjs --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/index.html > /dev/null && break; sleep 1; done
      - env:
          PARSER_BASE_URL: http://127.0.0.1:8000
        run: python examples/04_selenium_dynamic.py
