name: Деплой на GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Публикация dist
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Источник Pages — GitHub Actions?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Без этого шага configure-pages падает малопонятным HttpError: Not Found.
          code=$(curl -sS -o pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" != "200" ]; then
            echo "::error::Pages для этого репозитория не подключён к GitHub Actions (ответ API: $code). Включите: Settings → Pages → Build and deployment → Source: GitHub Actions. Если там выбрано «Deploy from a branch», сайт отдаёт Jekyll, а не наша сборка."
            exit 1
          fi
          build_type=$(python3 -c "import json; print(json.load(open('pages.json')).get('build_type'))")
          if [ "$build_type" != "workflow" ]; then
            echo "::error::Сейчас Pages публикуется из ветки (build_type: $build_type). Переключите Source на GitHub Actions — этот workflow сам соберёт dist."
            exit 1
          fi
      - id: pages
        uses: actions/configure-pages@v5
      - name: Сборка с адресом публикации
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node tools/generate.mjs --verify
          node tools/build.mjs
          node tools/check.mjs
      - name: Проверка относительных путей при публикации в подпапку
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          grep -q "Sitemap: $SITE_BASE_URL/sitemap.xml" dist/robots.txt
          ! grep -Eq '(src|href)="/[^/]' dist/index.html
        env:
          SITE_BASE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
