# Альтернативный хостинг: Netlify. GitHub Pages использует .github/workflows/deploy.yml.
# Нужен, если на уроках захотите настоящие HTTP-редиректы и свои заголовки ответов.

[build]
  command = "npm run build"
  publish = "dist"

# Настоящие 301/302 лежат в site/_redirects — сборка кладёт этот файл в dist,
# и Netlify читает его сам. Держим правила в одном месте, чтобы они не разъезжались
# с Cloudflare Pages, который понимает только _redirects.

# Заголовки для урока про CORS и content-type у «JSON API».
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Trainer-Mode = "practice-only"
